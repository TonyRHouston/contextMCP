name: Changeset Check
on:
  workflow_dispatch: {}
jobs:
  check:
    name: Check for Changeset
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Check for changeset
      uses: actions/github-script@v8
      with:
        script: "const { execSync } = require('child_process');\n\nconst labels =\
          \ context.payload.pull_request.labels.map(l => l.name);\nif (labels.includes('skip-changeset'))\
          \ {\n  console.log('Skipping changeset check for PR with skip-changeset\
          \ label');\n  return;\n}\n\nconst baseSha = context.payload.pull_request.base.sha;\n\
          const headSha = context.payload.pull_request.head.sha;\n\nconst diff = execSync(\n\
          \  `git diff --name-only ${baseSha}...${headSha}`,\n  { encoding: 'utf-8'\
          \ }\n);\n\nconst hasChangeset = diff\n  .split('\\n')\n  .some(file => file.startsWith('.changeset/')\
          \ && file.endsWith('.md') && !file.includes('README'));\n\nif (!hasChangeset)\
          \ {\n  core.setFailed(\n    'No changeset found. Please add a changeset\
          \ using `pnpm changeset` or add the \"skip-changeset\" label if this PR\
          \ doesn\\'t need one (e.g., docs, CI changes).'\n  );\n} else {\n  console.log('Changeset\
          \ found!');\n}\n"
